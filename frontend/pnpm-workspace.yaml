# pnpm 11 reads policy settings from this file. We are not actually using
# workspaces; the file is required only so we can set onlyBuiltDependencies.
#
# We deliberately allow no native build scripts. Sharp and unrs-resolver
# are not invoked at runtime in this app, and skipping their post-install
# scripts keeps the install reproducible across machines.
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  sharp: false
  unrs-resolver: false
