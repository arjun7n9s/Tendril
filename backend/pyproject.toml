[project]
name = "signalgraph-backend"
version = "0.1.0"
description = "SignalGraph - Autonomous GTM Change Intelligence backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    # Validation + settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # DB
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # HTTP + retries
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    # Logging
    "structlog>=24.4.0",
    # AI gateway (OpenAI-compatible)
    "openai>=1.55.0",
    # HTML parsing + markdown conversion
    "selectolax>=0.3.27",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.14.1",
    "tldextract>=5.1.3",
    # Browser fallback
    "playwright>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

# Optional integrations (Phase 8)
[project.optional-dependencies]
voice = ["speechmatics-batch>=0.4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
